name: Scala CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scala
    steps:
      - uses: actions/checkout@v5
      # JDK 8 to match the Hadoop/Hive setup (see docs/PHASE05_scala_spark_setup.md)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 8
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt compile package test
      # Plain-Scala phases assert their hand-verified values.
      - run: >-
          sbt "runMain com.startupsurvival.FinancialFeatureExtractor"
          "runMain com.startupsurvival.NameMatcher"
          "runMain com.startupsurvival.SentimentScorer"
          "runMain com.startupsurvival.FeatureExtractor"
      - uses: actions/upload-artifact@v6
        with:
          name: startup-survival-prediction-jar
          path: scala/target/scala-2.12/*.jar

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t startup-survival-demo .
      - name: Smoke test the image
        run: |
          docker run -d -p 8080:8080 startup-survival-demo
          for i in $(seq 30); do curl -sf localhost:8080/ > /dev/null && break; sleep 1; done
          curl -sf localhost:8080/ > /dev/null
          curl -sf localhost:8080/api/sentiment -H 'Content-Type: application/json' -d '{"headline":"Startup raises funding"}'
